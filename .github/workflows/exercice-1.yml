name: Exercice 1
on:
  push:

permissions:
  contents: read

jobs:
  test:
    name: Install and test
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Write job summary
        if: always()
        run: |
          echo "## Validation du projet" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Exercice : 1" >> "$GITHUB_STEP_SUMMARY"
          echo "- Statut du job : ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Ref du commit : ${{ github.ref }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA du commit : ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
