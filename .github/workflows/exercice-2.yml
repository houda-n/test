name: Exercice 2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and upload artifact
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Check build output
        run: test -f dist/index.html

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: application-dist
          path: dist/

      - name: Write build summary
        if: always()
        run: |
          echo "## Build de l'exercice 2" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Statut du job : ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Ref : ${{ github.ref }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit : ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Artifact : application-dist" >> "$GITHUB_STEP_SUMMARY"
          echo "- Fichier verifie : dist/index.html" >> "$GITHUB_STEP_SUMMARY"
